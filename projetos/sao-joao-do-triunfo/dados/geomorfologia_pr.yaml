- codigo: 2.3.4
  nome: Planalto de Ponta Grossa
  unidade: Segundo Planalto Paranaense
  folha: Ponta Grossa
  texto: A sub-unidade morfoescultural número 2.3.4, denominada Planalto de Ponta
    Grossa, situada no Segundo Planalto Paranaense, apresenta dissecação média e ocupa
    uma área de 7.194,07 km², que corresponde a 43,60% desta Folha. A classe de declividade
    predominante é menor que 12% em uma área de 6.124,54 km². Em relação ao relevo,
    apresenta um gradiente de 520 metros com altitudes variando entre 560 (mínima)
    e 1.080 (máxima) m. s. n. m. As formas predominantes são topos alongados, vertentes
    retilíneas e côncavas e vales em “U”. A direção geral de morfologia é NW-SE, modelada
    em rochas do Grupo Itararé.
  unidades_projeto:
  - São João do Triunfo - ETE
planaltos:
  Segundo Planalto Paranaense: A Zona de Denudação Periférica está esculpida na faixa
    de rochas Paleozóicas e apresenta-se, no Paraná, como um planalto modelado em
    estruturas monoclinais, sub-horizontais, mergulhando para o oeste, o Segundo Planalto
    Paranaense. A Zona de Denudação Periférica tem seus limites entre a escarpa Devoniana,
    a leste, onde as altitudes médias de cimeira estão entre 1100 a 1200m e, a oeste,
    com a escarpa arenito-basáltica (Serra Geral ou da Esperança) onde, em suas proximidades,
    as altitudes variam entre 350 e 560 metros s.n.m.
