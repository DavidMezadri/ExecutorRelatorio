aquiferos:
  Rio Bonito:
    hidrodinamica:
    - A profundidade perfurada variou entre 42 metros e 452 metros, com mediana de
      174 metros.
    - A profundidade do Nível Estático (NE), observada a partir de 61 poços, variou
      de 0,65 metros a 194,8 m, com mediana de 9 m.
    - A vazão mediana dos 61 poços tubulares que captam o Aquífero Rio Bonito é 10
      m³/h, com vazão mínima igual a 1m³/h, e vazão máxima de 132,5 m³/h.
    - A mediana da capacidade específica para os 61 poços que captam o aquífero Rio
      Bonito é 0,18 (m³/h)/m, com valor mínimo de 0,01 (m³/h)/m e valor máximo de
      5,8 (m³/h)/m.
    - Sendo que, o valor da capacidade específica é 0,1 (m³/h)/m para o percentil
      25 e 0,69 (m³/h)/m para o percentil 75.
    - 'O Aquífero Rio Bonito foi classificado em dois intervalos de classes de produtividade
      (CPRM, 2014): - Classe 4: produtividade geralmente baixa, porém localmente moderada.'
    vulnerabilidade:
    - Quatro classes de vulnerabilidade foram determinadas na análise do Aquífero
      Rio Bonito.
    - Predominam áreas classificadas com alta vulnerabilidade (62,9%), seguidas por
      áreas de extrema vulnerabilidade (31,1%), predominantemente na bacia do rio
      Iguaçu.
    - A classe média de vulnerabilidade à contaminação foi determinada em 5,9% da
      área desta unidade aquífera.
    unidade_iat:
    - Paleozóica Média Superior
    sanepar: Atualmente encontram-se em operação, para o abastecimento público de
      sistemas atendidos pela Sanepar, 39 poços que apresentam vazão média de 8,3m3/h
      por poço e profundidades em torno de 130 m. A tipologia hidroquímica das águas
      captadas enquadra-se nas classes bicarbonatada cálcica a bicarbonatada mista,
      com teores de sólidos dissolvidos bastante variáveis e elevados (150 a 600 mg/
      L).
formacoes:
  Formação Rio Bonito:
  - A formação compõe-se de um espesso pacote de arenitos esbranquiçados, finos a
    grosseiros, argilosos e micáceos, aos quais se intercalam nas seções basais conglomerados,
    arenitos muito finos, siltitos, argilitos, folhelhos carbonosos e carvão.
  - As camadas superiores da formação constituem-se de arenitos finos a muito finos,
    cinza-escuros, intercalados a siltitos e folhelhos carbonosos, dentro dos quais
    desenvolvem-se localmente leitos de carvão.
  - Na faixa aflorante possui espessura aproximada de 300m (MINEROPAR, 2014).
  - Formação Palermo - contato entre argilito (base) e siltito (topo).
