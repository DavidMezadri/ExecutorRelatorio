  ano: '2021'
  intro:
  - Apresentam cores vermelhas acentuadas, devido aos teores mais altos e à natureza
    dos óxidos de ferro presentes no material originário em ambientes bem drenados,
    e características de cor, textura e estrutura uniformes em profundidade.
  - São identificados em extensas áreas nas regiões Centro-Oeste, Sul e Sudeste do
    país, sendo responsáveis por grande parte da produção de grãos do país, pois ocorrem
    predominantemente em áreas de relevo plano e suave ondulado, propiciando a mecanização
    agrícola. Em menor expressão, podem ocorrer em áreas de relevo ondulado.
  - Por serem profundos e porosos ou muito porosos, apresentam condições adequadas
    para um bom desenvolvimento radicular em profundidade, principalmente se forem
    eutróficos (de fertilidade alta). No entanto, o potencial nutricional dos solos
    será bastante reduzido se forem álicos, pois existe a "barreira química" do alumínio
    que impede o desenvolvimento radicular em profundidade. Se o solo for ácrico,
    existe também uma "barreira química", mas neste caso, sendo mais relacionados
    aos baixos valores da soma de bases (especialmente cálcio) do que à saturação
    por alumínio, que não é alta nos solos ácricos. Além destes aspectos, são solos
    que, em condições naturais, apresentam baixos níveis de fósforo.
  - Outras limitações identificadas referem-se à baixa quantidade de água disponível
    às plantas e a susceptibilidade à compactação. Esta susceptibilidade, comumente
    verificada nos Latossolos Vermelhos de textura argilosa ou muito argilosa, pode
    ocorrer também nos Latossolos Vermelhos de textura média, espcecialmente se o
    teor de areia fina for elevado.
  grande_grupo: Distroférricos
  grande_grupo_desc: Solos de baixa fertilidade e altos teores de ferro.
