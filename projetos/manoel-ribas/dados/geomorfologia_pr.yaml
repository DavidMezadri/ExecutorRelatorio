subunidades:
- codigo: 2.4.1
  nome: Planalto Pitanga/Ivaiporã
  unidade: Terceiro Planalto Paranaense
  folha: Campo Mourão
  texto: A sub-unidade morfoescultural número 2.4.1, denominada Planalto Pitanga/Ivaiporã,
    situada no Terceiro Planalto Paranaense, apresenta dissecação média e ocupa uma
    área de 2.398,46 km², que corresponde a 14,54% desta Folha. A classe de declividade
    predominante é menor que 12% em uma área de 1.773,88 km². Em relação ao relevo,
    apresenta um gradiente de 860 metros com altitudes variando entre 360 (mínima)
    e 1220 (máxima) m. s. n. m. As formas predominantes são topos alongados, vertentes
    convexas e vales em “V”, modeladas em rochas da Formação Serra Geral.
  unidades_projeto:
  - Manoel Ribas - ETE
planaltos:
  Terceiro Planalto Paranaense: A Zona de Capeamento Areníto-Basáltico corresponde
    ao grande derrame mesozóico de rochas eruptivas básicas que, no território paranaense,
    apresenta-se como o Terceiro Planalto Paranaense, ou Planalto Areníto-Basáltico
    e abrange cerca de 2/3 do território paranaense. Esta unidade desenvolve-se como
    um conjunto de relevos planálticos, com inclinação geral para oeste-noroeste e
    subdivididos pelos principais afluentes do rio Paraná, atingindo altitudes médias
    de cimeira de 1100 a 1250m, na Serra da Esperança, declinando para altitudes entre
    220 e 300 metros na calha do rio Paraná. Segundo Maack (1968) este planalto subdivide-se
    em a) Planalto de Cambará e São Jerônimo da Serra, localizado na parte nordeste
    do Estado, tendo seus limites nos rios Tibagi, Paranapanema e Itararé; b) Planalto
    de Apucarana, que se estende entre os rios Tibagi, Paranapanema, Ivaí e Paraná;
    c) Planalto de Campo Mourão, compreendido entre os rios Ivaí, Piquirí e Paraná;
    d) Planalto de Guarapuava, que ocupa terras entre os rios Piquiri, Iguaçu e Paraná
    e, e) Planalto de Palmas, que se estende entre o divisor norte da bacia do rio
    Uruguai e sul da bacia do Iguaçu até o vale deste.
