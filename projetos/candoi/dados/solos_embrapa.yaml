- classe: CXa - Cambissolo Háplico Alumínico
  encontrada: true
  pagina: Cambissolos Háplicos
  url: https://www.embrapa.br/agencia-de-informacao-tecnologica/tematicas/solos-tropicais/sibcs/chave-do-sibcs/cambissolos/cambissolos-haplicos
  ano: '2021'
  intro:
  - Cambissolos identificados normalmente em relevos forte ondulados ou montanhosos,
    que não apresentam horizonte supefcial A Húmico.
  - São solos de fertilidade natural variável. Apresentam como principais limitações
    para uso, o relevo com declives acentuados, a pequena profundidade e a ocorrência
    de pedras na massa do solo.
  grande_grupo: Alumínicos
  grande_grupo_desc: Teores muito elevados de alumínio no solo afetando significativamente
    o desenvolvimento de raízes; atividade de argila menor do que 20 cmolc/kg de argila.
