classes:
- classe: LBa - Latossolo Bruno Alumínico
  encontrada: true
  pagina: Latossolos Brunos
  url: https://www.embrapa.br/agencia-de-informacao-tecnologica/tematicas/solos-tropicais/sibcs/chave-do-sibcs/latossolos/latossolos-brunos
  ano: '2021'
  intro:
  - Apresentam cores amarelas avermelhadas (brunadas) com enriquecimento de matéria
    orgânica na superfície, argilosos e muito argilosos, desenvolvidos em condições
    de clima subtropical e derivados de rochas basálticas e riodacíticas do Sul do
    Brasil, apresentando horizonte superficial húmico ou teores de carbono orgânico
    superiores a 1% até 70 cm ou mais de profundidade.
  - A textura é argilosa ou muito argilosa ao longo do perfil, sendo que o horizonte
    A (superficial) é relativamente escuro, ocorrendo sobrejacente ao horizonte de
    cor brunada. Apresentam alta capacidade de retração com a perda de umidade, evidenciado
    pelo fendilhamento acentuado em cortes de barrancos expostos ao sol por curtos
    espaços de tempo (uma semana ou mais) formando uma estrutura tipo prismática.
  - Por serem profundos e muito porosos em condições naturais, não apresentam limitação
    física ao desenvolvimento radicular em profundidade. No entanto, estes solos possuem
    baixo potencial nutricional e teores de alumínio em profundidade, que podem afetar
    o enraizamento. Esta limitação é agravada devido à baixa quantidade de água disponível
    às planta.
  - Os Latossolos Brunos ocorrem principalmente nas áreas elevadas dos planaltos do
    Sul do Brasil, onde a altitude supera 800 m (clima frio e úmido) e com menor expressão
    no planalto de Poços de Caldas, Minas Gerais, e sua borda em território paulista.
    No Sul do Brasil, têm sido utilizados para fruticultura.
  grande_grupo: Alumínicos
  grande_grupo_desc: Teores muito elevados de alumínio no solo afetando significativamente
    o desenvolvimento de raízes; atividade de argila menor do que 20 cmolc/kg de argila.
