texto: 'O acesso final às unidades se dá pela Estrada Velha de Palmas (não pavimentada,
  em leito natural), a partir da BR-153, via pavimentada que constitui a principal
  ligação com a sede municipal (7,9 km do percurso de 10,4 km) (OSRM, 2026; OPENSTREETMAP,
  2026).


  O acesso às unidades Jangada do Sul - General Carneiro Área do poço e tratamento
  e Jangada do Sul - General Carneiro Adutora (@fig:acesso-1) foi levantado a partir
  de rotas calculadas sobre a malha viária do OpenStreetMap (OSRM, 2026; OPENSTREETMAP,
  2026), considerando diferentes pontos de origem do deslocamento. As alternativas
  de acesso identificadas são apresentadas a seguir:


  - A partir da sede municipal (também Acesso Oeste): percurso de 10,4 km, seguindo
  pela Rua Presidente Castelo Branco (560 m, revestimento não informado), pela Rua
  Francisco Costa (360 m, revestimento não informado), pela rodovia sem denominação
  (90 m, revestimento não informado), pela Via Marginal (540 m, revestimento não informado),
  pela BR-153 (7,9 km, pavimentada), pela Rua Bernardo Ribeiro Viana (500 m, revestimento
  não informado) e pela Estrada Velha de Palmas (400 m, não pavimentada, em leito
  natural), via que dá acesso à unidade; 76% do percurso em vias pavimentadas, 4%
  em vias não pavimentadas e 20% em vias sem revestimento informado na base consultada;

  - A partir do núcleo urbano da localidade: percurso de 640 m, seguindo pela Rua
  Bernardo Ribeiro Viana (240 m, revestimento não informado) e pela Estrada Velha
  de Palmas (400 m, não pavimentada, em leito natural), via que dá acesso à unidade;
  0% do percurso em vias pavimentadas, 62% em vias não pavimentadas e 38% em vias
  sem revestimento informado na base consultada;

  - Acessos Norte, Sul e Leste: percurso de 5,1 km, seguindo pela BR-153 (4,1 km,
  pavimentada), pela via sem denominação (100 m, revestimento não informado), pela
  Rua Bernardo Ribeiro Viana (530 m, revestimento não informado) e pela Estrada Velha
  de Palmas (400 m, não pavimentada, em leito natural), via que dá acesso à unidade;
  80% do percurso em vias pavimentadas, 8% em vias não pavimentadas e 12% em vias
  sem revestimento informado na base consultada.


  O traçado da unidade Jangada do Sul - General Carneiro Adutora (590 m) acompanha
  as seguintes vias, o que facilita o acesso para implantação e manutenção: Estrada
  Velha de Palmas (450 m, 75% do traçado, não pavimentada, em leito natural); Rua
  Bernardo Ribeiro Viana (200 m, 33% do traçado, revestimento não informado); BR-153
  (60 m, 10% do traçado, pavimentada) (OPENSTREETMAP, 2026).


