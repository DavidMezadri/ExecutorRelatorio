aquiferos:
  Serra Geral:
    hidrodinamica:
    - A profundidade do Nível Estático (NE), observada a partir de 1.626 poços, variou
      de 0,28 m a 195,8 m, com mediana de 16 m.
    - A vazão mediana dos poços que captam o Aquífero Serra Geral é 9 m³/h, com vazão
      mínima igual a 0,2 m³/h, no município de Capitão Leônidas Marques e, vazão máxima
      de 250 m³/h no município de Cascavel.
    - A mediana da capacidade específica para os 1.626 poços que captam o aquífero
      é 0,54 (m³/h)/m, com valor mínimo de 0,01 (m³/h)/m e valor máximo de 45 (m³/h)/m.
    - Sendo que, o valor da capacidade específica equivale a 0,16 (m³/h)/m para o
      percentil 25 e 1,62 (m³/h)/m para percentil 75.
    - Assim como ocorre com os dados de vazão, a capacidade específica também apresenta
      um zoneamento de produtividade, predominando poços mais produtivos na “Província
      Hidroestrututural Jacutinga Noroeste”, proposta por Athayde et al. (2012 apud
      BRASIL, 2015), com destaque para a Bacia Hidrográfica do Paraná 3 (BP3), no
      extremo oeste da unidade aquífera.
    - A região da bacia hidrográfica do rio Iguaçu apresenta o maior risco exploratório
      do Aquífero Serra Geral no Paraná.
    vulnerabilidade:
    - No Aquífero Serra Geral predominam áreas com vulnerabilidade alta (58,5%) e
      secundariamente áreas com média vulnerabilidade (41,4%).
    - A classe média de vulnerabilidade ocorre em maior área nas bacias do Paraná
      3 e Iguaçu, nesta última, na região de Francisco Beltrão, Pato Branco e Dois
      Vizinhos.
    - Nas demais bacias predominam áreas de alta vulnerabilidade.
    unidade_iat:
    - Serra Geral Sul
    sanepar: Atualmente, a Sanepar opera 414 poços no Aquífero Serra Geral, que produziram
      cerca de 50,5 milhões m³ de água no ano de 2001. Esse volume representa cerca
      de 52% da produção total de água subterrânea da Sanepar, revelando a importância
      do Aquífero Serra Geral, principalmente para o abastecimento de pequenas e médias
      localidades.
formacoes:
  Grupo Serra Geral:
  - Foram identificados depósitos hidrovulcanoclásticos na Formação Serra Geral, identificadas
    camadas de brechas constituídas por clastos juvenis de basalto ou basalto-andesítico,
    vesiculares, angulosos globulares, imersos em uma matriz areno-síltico-argilosa
    quartzo-feldspática-micácea, e também camadas decimétricas constituídas de material
    areno-síltico-argiloso quartzo-feldspático-micáceo intercaladas aos derrames de
    basalto ou basalto-andesítico (LICHT, 2012 apud BRASIL, 2015).
  - A frequência, espessura e continuidade lateral das camadas destes depósitos hidrovulcanoclásticos,
    bem como a proporção relativa aos derrames, foram alguns dos critérios para definir
    quatro formações (Cascavel, Barracão, Candói e Covó) e 13 membros para a Formação
    Serra Geral do Estado do Paraná (ARIOLI; LICHT, 2013 apud BRASIL, 2015).
  - 'Na região sudoeste do estado Arioli e Licht (2013 apud BRASIL, 2015) identificam
    estas quatro formações com a seguinte descrição: A Formação Cascavel é constituída
    por uma sequência de derrames lobados, lobos tabulares e derrames tabulares de
    basalto dominantemente avermelhado, com intercalações de rochas vulcanoclásticas
    e sedimentos terrígenos.'
  - A Formação Barracão compreende sequências de derrames dominantemente lobados,
    menos frequentemente derrames tabulares extensos de basalto vesicular avermelhado,
    com abundantes intercalações de brechas vulcanoclásticas e rochas sedimentares,
    boa parte de origem turfácea ou deposição química.
  - A Formação Candói compreende uma sequência de derrames tabulares espessos de basalto
    cinza, sem cloritização ou oxidação visível em amostra de mão, com zona vesicular
    de topo descontínua e frequentemente ausente, disjunção colunar e entablamento
    sigmoidal bem desenvolvidos.
  - Tanto os basaltos da Formação Barracão quanto da Formação Candói, em áreas diferentes,
    são recobertos pelos depósitos de ignimbrito reomórfico e lava riolítica da Formação
    Covó.
  - Os ignimbritos de composição dominantemente riodacítica e textura porfirítica,
    com associação de quartzo-latito, andesito, riolito, brecha de fluxo e vitrófiro
    (ARIOLI; LICHT, 2013 apud BRASIL, 2015).
formacoes_sgb:
  Grupo Serra Geral:
    sigla: K1sg
    hierarquia: Grupo
    nome_pai: J3K1sb - Supergrupo São Bento
    legenda: Sequência vulcanossedimentar formada na base por arenitos eólicos depositados
      em grandes campos de dunas de ambiente desértico, sobrepostos por derrames toleíticos
      de lavas básicas, intermediárias e ácidas. Intercalações comuns entre lavas
      e depósitos sedimentares, arenitos e lamitos. Derrames de basaltos e andesitos
      basálticos extensos em morfologias pahoehoe simples e compostos e rubbly pahoehoe.
      Derrames, domos e coulées formados por riolitos e dacitos afíricos e traquidacitos
      porfiríticos. Depósitos vulcanoclásticos máficos, brechas, tufos, hialoclastitos
      e peperitos. Localmente pillow-lavas. 134,6 ± 0,6 Ma (40Ar-39Ar step heating);
      134,4 ± 1,1 Ma (U-Pb SHRIMP); 133,6 Ma (U-Pb CA-ID-TIMS); 132,9 Ma (U-Pb CA-ID-TIMS).   Regionalmente,
      diques e soleiras de basalto, diabásio ou microgabro, gabro, andesito, diorito,
      microdiorito e traquiandesito.
    litotipos: Andesito basáltico, Arenito, Arenito lítico, Basalto, Basalto andesítico,
      Dacito, Diabásio, Diorito, Gabro, Riodacito, Riolito, Traquiandesito, Traquidacito,
      Tufito
