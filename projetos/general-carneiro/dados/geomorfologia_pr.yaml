subunidades:
- codigo: 2.4.2
  nome: Planalto do Foz do Areia/Ribeirão Claro
  unidade: Terceiro Planalto Paranaense
  folha: Clevelândia
  texto: A sub-unidade morfoescultural número 2.4.2, denominada Planalto do Foz do
    Areia/Ribeirão Claro, situada no Terceiro Planalto Paranaense, apresenta dissecação
    alta e ocupa uma área de 2.411,20 km², que corresponde a 14,61% desta Folha. A
    classe de declividade predominante está entre 12-30% em uma área de 1.007,65 km².
    Em relação ao relevo, apresenta um gradiente de 720 metros com altitudes variando
    entre 620 (mínima) e 1.340 (máxima) m. s. n. m. As formas predominantes são topos
    alongados, vertentes retilíneas e côncavas e vales em degraus. A direção geral
    da morfologia é NW/SE, modelada em rochas da Formação Serra Geral.
  unidades_projeto:
