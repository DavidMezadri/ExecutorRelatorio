  ano: '2021'
  intro:
  - Classes dos Cambissolos caracterizados pela presença do horizonte A superficial
    húmico, que se caracteriza pela cor escura, rica em matéria orgânica, associado
    a climas frios de altitude ou clima subtropical do Sul do Brasil.
  - São solos de baixa fertilidade, geralmente ácidos, sendo mais utilizados para
    cultivos de subsistência, pastagem e reflorestamento.
  grande_grupo: Alumínicos
  grande_grupo_desc: Teores muito elevados de alumínio no solo afetando significativamente
    o desenvolvimento de raízes; atividade de argila menor do que 20 cmolc/kg de argila.
