texto: 'A unidade Jangada do Sul - General Carneiro Área do poço e tratamento localiza-se
  em área rural, a cerca de 280 m do núcleo urbano de Jangada do Sul, com acesso pela
  Estrada Velha de Palmas (não pavimentada, em leito natural), lindeira à unidade
  (OPENSTREETMAP, 2026).


  O traçado da unidade Jangada do Sul - General Carneiro Adutora (590 m) desenvolve-se
  em área predominantemente rural, com trechos em área urbana, a cerca de 80 m do
  núcleo urbano de Jangada do Sul. Ao longo de seu percurso, segue margeando a Estrada
  Velha de Palmas (não pavimentada, em leito natural) por cerca de 430 m e a Rua Bernardo
  Ribeiro Viana (revestimento não informado) por cerca de 180 m (OPENSTREETMAP, 2026),
  e cruza a BR-153. A classificação da área como urbana ou rural baseia-se no mapeamento
  de uso do solo (PROJETO MAPBIOMAS, 2024).


  Segundo o histórico municipal registrado pelo IBGE, o município de General Carneiro,
  situa-se na região sul do estado do Paraná, nas margens da BR 153, rota do merco
  sul, ocupando a extrema extensão sul do 3º planalto paranaense, faz parte da micro
  região 15º (décima quinta) zona fisiográfica em que está dividido o estado do Paraná.
  Surgiu com advento das expedições dos tropeiros que se deslocavam dos Campos Gerais
  em busca dos Campos de Palmas, município que pertenceu até a sua emancipação política
  - administrativa no ano de 1961. A vila já contava com várias famílias de desbravadores,
  atraídos pela riqueza da cobertura florestal aqui existente. Iniciou-se com a ocupação
  da Vila "Passo da Galinha", antigo pouso de tropeiros. As primeiras construções
  estabeleceram-se em torno da primeira casa de comércio (IBGE, [20--]).


  Na atual divisão territorial, o município é constituído pelos distritos de General
  Carneiro e Jangada do Sul, sendo Jangada do Sul a localidade onde se insere o empreendimento
  (IBGE, [20--]).


  O município de General Carneiro possui população de 11.062 habitantes e densidade
  demográfica de 10,33 hab/km² (IBGE, 2023). Quanto ao saneamento, 79,0% dos domicílios
  utilizam a rede geral de abastecimento de água como forma principal e 52,4% destinam
  o esgoto à rede geral ou pluvial (IBGE, 2023).


  No entorno das unidades (raio de 600 m), a base colaborativa OpenStreetMap registra:
  templo religioso Capela de Nossa Senhora Aparecida (a cerca de 410 m da unidade
  Jangada do Sul - General Carneiro Área do poço e tratamento) e cemitério (a cerca
  de 580 m da unidade Jangada do Sul - General Carneiro Área do poço e tratamento)
  (OPENSTREETMAP, 2026). A identificação desses locais permite reconhecer os elementos
  de relevância social, religiosa e cultural próximos ao empreendimento e subsidia
  a avaliação de eventuais interferências das obras sobre eles e sobre seu acesso,
  como alterações temporárias no tráfego, ruídos e poeira.


  Nos trechos em vias não pavimentadas (Estrada Velha de Palmas), o tráfego de veículos
  e máquinas da obra tende a gerar poeira em períodos secos e lama em períodos chuvosos,
  devendo-se prever umectação das vias, sinalização e recomposição do leito ao final
  das obras.


