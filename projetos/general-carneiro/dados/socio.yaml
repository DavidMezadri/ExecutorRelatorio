historico:
  historico: O município de General Carneiro, situa-se na região sul do estado do
    Paraná, nas margens da BR 153, rota do merco sul, ocupando a extrema extensão
    sul do 3º planalto paranaense, faz parte da micro região 15º (décima quinta) zona
    fisiográfica em que está dividido o estado do Paraná. Surgiu com advento das expedições
    dos tropeiros que se deslocavam dos Campos Gerais em busca dos Campos de Palmas,
    município que pertenceu até a sua emancipação política - administrativa no ano
    de 1961. A vila já contava com várias famílias de desbravadores, atraídos pela
    riqueza da cobertura florestal aqui existente. Iniciou-se com a ocupação da Vila
    "Passo da Galinha", antigo pouso de tropeiros. As primeiras construções estabeleceram-se
    em torno da primeira casa de comércio.
  formacao: 'Distrito criado com a denominação de São José de Palmas (ex-povoado de
    Passo de Galinha), pela lei estadual nº 3758, de 02-08-1958, subordinado ao município
    de Palmas. Em divisão territorial datada de 1-VII-1960, o distrito de São José
    de Palmas, figura no município de Palmas. Elevado à categoria de município com
    a denominação de General Carneiro, pela lei estadual nº 4338 de 25-08-1961, desmembrado
    de Palmas. Sede no atual distrito de General Carneiro (ex-povoado). Constituído
    de 3 distritos: General Carneiro (ex-São José de Palmas), Colônia General Carneiro
    (ex-General Carneiro) e Jangada do Sul. Instalado em 19-12-1961. Em divisão territorial
    datada de 31-XII-1963, o município é constituído de 3 distritos: General Carneiro,
    Colônia General Carneiro e Jangada do Sul. Assim permencendo em divisão territorial
    datada de 1-I-1979. Pelo ofício nº 1717, de 16-06-1980, da DEGE, o distrito de
    Colônia General Carneiro foi extinto, por não existir lei especifica que o tenha
    criado como distrito administrativo. Em divisão territorial datada de 1-VII-1983,
    o município é constituído de 2 distritos: General Carneiro e Jangada do Sul. Assim
    permencendo em divisão territorial datada de 2007.'
