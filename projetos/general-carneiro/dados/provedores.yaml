- paragrafos:
  - 'No Paraná, foram identificados depósitos hidrovulcanoclásticos na Formação Serra
    Geral, identificadas camadas de brechas constituídas por clastos juvenis de basalto
    ou basalto-andesítico, vesiculares, angulosos globulares, imersos em uma matriz
    areno-síltico-argilosa quartzo-feldspática-micácea, e também camadas decimétricas
    constituídas de material areno-síltico-argiloso quartzo-feldspático-micáceo intercaladas
    aos derrames de basalto ou basalto-andesítico (LICHT, 2012 apud BRASIL, 2015).
    A frequência, espessura e continuidade lateral das camadas destes depósitos hidrovulcanoclásticos,
    bem como a proporção relativa aos derrames, foram alguns dos critérios para definir
    quatro formações (Cascavel, Barracão, Candói e Covó) e 13 membros para a Formação
    Serra Geral do Estado do Paraná (ARIOLI; LICHT, 2013 apud BRASIL, 2015). Na região
    sudoeste do estado Arioli e Licht (2013 apud BRASIL, 2015) identificam estas quatro
    formações com a seguinte descrição: A Formação Cascavel é constituída por uma
    sequência de derrames lobados, lobos tabulares e derrames tabulares de basalto
    dominantemente avermelhado, com intercalações de rochas vulcanoclásticas e sedimentos
    terrígenos. A Formação Barracão compreende sequências de derrames dominantemente
    lobados, menos frequentemente derrames tabulares extensos de basalto vesicular
    avermelhado, com abundantes intercalações de brechas vulcanoclásticas e rochas
    sedimentares, boa parte de origem turfácea ou deposição química. A Formação Candói
    compreende uma sequência de derrames tabulares espessos de basalto cinza, sem
    cloritização ou oxidação visível em amostra de mão, com zona vesicular de topo
    descontínua e frequentemente ausente, disjunção colunar e entablamento sigmoidal
    bem desenvolvidos. Tanto os basaltos da Formação Barracão quanto da Formação Candói,
    em áreas diferentes, são recobertos pelos depósitos de ignimbrito reomórfico e
    lava riolítica da Formação Covó (BRASIL, 2015).'
