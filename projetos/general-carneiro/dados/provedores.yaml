hidrologia:
- paragrafos:
  - Segundo a Base Hidrográfica Ottocodificada (BHO 2017) da Agência Nacional de Águas
    e Saneamento Básico, o curso d'água principal mais próximo das unidades Jangada
    do Sul - General Carneiro Área do poço e tratamento e Jangada do Sul - General
    Carneiro Adutora é o Rio Jangadinha, de domínio federal, com área de drenagem
    de aproximadamente 1.065 km² a montante do trecho e extensão total de 137,7 km
    do curso d'água (ANA, 2018).
  - Na divisão hidrográfica nacional, a área do empreendimento insere-se na Região
    Hidrográfica do Paraná (ANA, [20--]).
  - No cadastro de outorgas de direito de uso de recursos hídricos disponibilizado
    pela ANA, constam 9 outorgas de captação superficial num raio de aproximadamente
    5 km do empreendimento, entre elas outorga em nome de SANEPAR - General Carneiro
    - Jangada do Sul no Rio Jangada (ANA, [20--]).
  opcionais:
