- paragrafos:
  - No âmbito estadual, o empreendimento situa-se na Bacia Hidrográfica do Rio Iguaçu,
    que ocupa 55.758,09 km² do território paranaense (BRASIL, 2015), na Unidade Hidrográfica
    Afluentes do Médio Iguaçu, conforme a divisão estabelecida pela Resolução CERH/PR
    nº 49/2006 (IAT, [2020]). A bacia integra a Região Hidrográfica do Paraná, que
    abrange 92,2% do território paranaense (BRASIL, 2015).
