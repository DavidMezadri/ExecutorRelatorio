- paragrafos:
  - No mapeamento das unidades aquíferas do Paraná, o empreendimento situa-se na unidade
    Serra Geral Sul (IAT, [2020]), correspondente ao Aquífero Serra Geral descrito
    na Carta das Águas Subterrâneas do Paraná (BRASIL, 2015).
  - A profundidade do Nível Estático (NE), observada a partir de 1.626 poços, variou
    de 0,28 m a 195,8 m, com mediana de 16 m. A vazão mediana dos poços que captam
    o Aquífero Serra Geral é 9 m³/h, com vazão mínima igual a 0,2 m³/h, no município
    de Capitão Leônidas Marques e, vazão máxima de 250 m³/h no município de Cascavel.
    A mediana da capacidade específica para os 1.626 poços que captam o aquífero é
    0,54 (m³/h)/m, com valor mínimo de 0,01 (m³/h)/m e valor máximo de 45 (m³/h)/m.
    Sendo que, o valor da capacidade específica equivale a 0,16 (m³/h)/m para o percentil
    25 e 1,62 (m³/h)/m para percentil 75. Assim como ocorre com os dados de vazão,
    a capacidade específica também apresenta um zoneamento de produtividade, predominando
    poços mais produtivos na “Província Hidroestrututural Jacutinga Noroeste”, proposta
    por Athayde et al. (2012 apud BRASIL, 2015), com destaque para a Bacia Hidrográfica
    do Paraná 3 (BP3), no extremo oeste da unidade aquífera. A região da bacia hidrográfica
    do rio Iguaçu apresenta o maior risco exploratório do Aquífero Serra Geral no
    Paraná (BRASIL, 2015).
  - Quanto à vulnerabilidade natural à contaminação, no Aquífero Serra Geral predominam
    áreas com vulnerabilidade alta (58,5%) e secundariamente áreas com média vulnerabilidade
    (41,4%). A classe média de vulnerabilidade ocorre em maior área nas bacias do
    Paraná 3 e Iguaçu, nesta última, na região de Francisco Beltrão, Pato Branco e
    Dois Vizinhos. Nas demais bacias predominam áreas de alta vulnerabilidade (BRASIL,
    2015).
  - No abastecimento público, atualmente, a Sanepar opera 414 poços no Aquífero Serra
    Geral, que produziram cerca de 50,5 milhões m³ de água no ano de 2001. Esse volume
    representa cerca de 52% da produção total de água subterrânea da Sanepar, revelando
    a importância do Aquífero Serra Geral, principalmente para o abastecimento de
    pequenas e médias localidades (MENDES et al., 2002).
