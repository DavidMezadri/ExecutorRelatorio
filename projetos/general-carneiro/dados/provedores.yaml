geologia:
- paragrafos:
  - Do ponto de vista geológico, segundo o Mapa geológico e de recursos minerais do
    Estado do Paraná (escala 1:600.000), as unidades do empreendimento assentam-se
    sobre a Formação Vale do Sol, do Cretáceo Inferior (Era Mesozoica), integrante
    do Grupo Serra Geral, com litotipos de andesito basáltico (SGB, [20--]).
  - 'A unidade é descrita pelo Serviço Geológico do Brasil como sequência vulcânica
    com espessura real entre 40 e 500 m, formada principalmente por andesitos basálticos
    dispostos em derrames com geometria tabular simples, formados por lavas rubbly
    pahoehoe, os quais estão arquitetados em quarto partes: crosta basal vesiculada,
    núcleo maciço, crosta vesiculada coerente e superfície brechada (rubbly). Os derrames
    têm espessura entre 20 e 60 m (SGB, [20--]).'
  - Em escala regional (1:1.000.000), a área insere-se no Grupo Serra Geral, descrito
    como sequência vulcanossedimentar formada na base por arenitos eólicos depositados
    em grandes campos de dunas de ambiente desértico, sobrepostos por derrames toleíticos
    de lavas básicas, intermediárias e ácidas. Intercalações comuns entre lavas e
    depósitos sedimentares, arenitos e lamitos. Derrames de basaltos e andesitos basálticos
    extensos em morfologias pahoehoe simples e compostos e rubbly pahoehoe. Derrames,
    domos e coulées formados por riolitos e dacitos afíricos e traquidacitos porfiríticos.
    Depósitos vulcanoclásticos máficos, brechas, tufos, hialoclastitos e peperitos.
    Localmente pillow-lavas (SGB, [20--]).
