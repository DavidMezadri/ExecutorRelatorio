hidrogeologia:
- paragrafos:
  - Segundo o mapa de domínios e subdomínios hidrogeológicos do Brasil, a área do
    empreendimento insere-se no domínio Vulcânicas (unidade Serra Geral) (SGB, [20--]).
  - No Sistema de Informações de Águas Subterrâneas (SIAGAS), mantido pelo Serviço
    Geológico do Brasil, constam 17 poços tubulares cadastrados num raio de aproximadamente
    15 km do empreendimento, captando principalmente o aquífero Serra Geral; os registros
    com informação indicam profundidade mediana de 120 m, nível estático mediano de
    85,0 m e vazão específica mediana de 0,43 (m³/h)/m (SGB, [20--]).
